name: Windows portable executable

on:
  push:
    branches:
      - fix/codex-windows-support-20261009
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package, tests and PyInstaller
        run: python -m pip install -e . pytest pyinstaller
      - name: Run test suite on Windows
        run: python -m pytest -q
      - name: Build portable EXE
        run: >
          python -m PyInstaller
          --noconfirm --clean --onefile --windowed
          --name ClaudeUsageWidget
          --collect-data claude_usage
          --hidden-import PySide6.QtSvg
          scripts/windows_launcher.py
      - name: Validate executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ClaudeUsageWidget.exe")) { throw "Executable not produced" }
          Get-Item "dist/ClaudeUsageWidget.exe" | Select-Object Name,Length
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Test configuration migration
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP "widget-test-config.json"
          '{"theme":"dracula","providers":["claude"],"osd_scale":1.3}' | Set-Content -Path $config -Encoding ascii
          & "./scripts/setup_windows_config.ps1" -ConfigPath $config
          $saved = Get-Content $config -Raw | ConvertFrom-Json
          if ($saved.theme -ne "dracula" -or $saved.osd_scale -ne 1.3 -or
              @($saved.providers).Count -ne 2 -or
              "codex" -notin @($saved.providers)) { throw "Config migration failed" }
      - name: Package Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing: $iscc" }
          & $iscc "installer/windows.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist/ClaudeUsageWidget-Setup-Windows-x64.exe")) { throw "Installer missing" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageWidget-Installer-Windows-x64
          path: dist/ClaudeUsageWidget-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageWidget-Windows-x64
          path: dist/ClaudeUsageWidget.exe
          if-no-files-found: error
          retention-days: 30
